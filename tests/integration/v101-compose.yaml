name: exin-bf-v101
services:
  db:
    image: mariadb:11.4@sha256:5e73baf8179b29f115101bb102763a47a017361f3e9792daccba6646c3ab1532
    environment:
      MARIADB_DATABASE: exin_test
      MARIADB_USER: exin
      MARIADB_PASSWORD: local-v101-only
      MARIADB_ROOT_PASSWORD: local-v101-root-only
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 2s
      retries: 40
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 40
  wordpress:
    image: wordpress:7.1.4-php8.2-fpm-alpine@sha256:2abfa39fb9f6833379205fd3e48a8aa9e113befa2fb64d9a7de96825c853ad17
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: exin_test
      WORDPRESS_DB_USER: exin
      WORDPRESS_DB_PASSWORD: local-v101-only
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('DISABLE_WP_CRON', true);
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_HTTP_BLOCK_EXTERNAL', true);
        define('WP_REDIS_HOST', 'redis');
        define('WP_REDIS_CLIENT', 'predis');
        define('WP_REDIS_PREFIX', 'exin-v101:' . $$table_prefix);
    volumes:
      - wordpress:/var/www/html
      - ${EXIN_V101_PLUGIN_SOURCE:-${EXIN_TEST_ROOT}}:/var/www/html/wp-content/plugins/exin-black-friday:ro
      - ${EXIN_TEST_ROOT}/tests/integration/v101-mu-guard.php:/var/www/html/wp-content/mu-plugins/exin-v101-test-guard.php:ro
      - ${EXIN_TEST_ROOT}/work/runtime/wp-cli.phar:/usr/local/bin/wp:ro
      - ${EXIN_TEST_ROOT}/work/v101/runtime/woocommerce.zip:/tmp/woocommerce.zip:ro
      - ${EXIN_TEST_ROOT}/work/v101/runtime/redis-cache.zip:/tmp/redis-cache.zip:ro
      - ${EXIN_TEST_ROOT}/work/runtime/elementor.zip:/tmp/elementor.zip:ro
      - /etc/ssl/certs/ca-certificates.crt:/tmp/proxy-ca.pem:ro
  web:
    image: nginx:alpine
    depends_on:
      - wordpress
    ports:
      - "127.0.0.1:8891:80"
    volumes:
      - wordpress:/var/www/html:ro
      - ${EXIN_V101_PLUGIN_SOURCE:-${EXIN_TEST_ROOT}}:/var/www/html/wp-content/plugins/exin-black-friday:ro
      - ${EXIN_TEST_ROOT}/tests/integration/v101-nginx.conf:/etc/nginx/conf.d/default.conf:ro
volumes:
  database:
  wordpress:
  redisdata:
